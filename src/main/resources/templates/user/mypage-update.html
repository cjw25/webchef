<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>내 정보 수정 | WebChef</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/mypage.css}">
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="mypage-page">

    <section class="mypage-hero">
        <div>
            <span class="mypage-badge">EDIT PROFILE</span>

            <h1>내 정보 수정</h1>

            <p>
                이름, 이메일, 비밀번호를 수정할 수 있습니다.
            </p>
        </div>

        <a href="/mypage" class="mypage-edit-btn black">
            돌아가기
        </a>
    </section>

    <section class="edit-layout">

        <form th:action="@{/mypage/update}"
              method="post"
              th:object="${request}"
              class="edit-card">

            <input type="hidden"
                   th:if="${_csrf != null}"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <div class="edit-header">
                <span>PROFILE UPDATE</span>
                <h2>계정 정보 수정</h2>
                <p>
                    비밀번호를 변경하지 않으려면 비밀번호 입력란은 비워두세요.
                </p>
            </div>

            <p class="error-message"
               th:if="${errorMessage != null}"
               th:text="${errorMessage}">
                에러 메시지
            </p>

            <div class="form-group">
                <label>아이디</label>
                <input type="text"
                       th:value="${user.username}"
                       readonly>
            </div>

            <div class="form-group">
                <label for="name">이름</label>
                <input type="text"
                       id="name"
                       th:field="*{name}"
                       placeholder="이름을 입력하세요"
                       required>
            </div>

            <div class="form-group">
                <label for="email">이메일</label>
                <input type="email"
                       id="email"
                       th:field="*{email}"
                       placeholder="이메일을 입력하세요"
                       required>
            </div>

            <div class="form-group">
                <label for="password">새 비밀번호</label>
                <input type="password"
                       id="password"
                       th:field="*{password}"
                       placeholder="변경할 비밀번호를 입력하세요">
            </div>

            <div class="form-group">
                <label for="passwordCheck">새 비밀번호 확인</label>
                <input type="password"
                       id="passwordCheck"
                       th:field="*{passwordCheck}"
                       placeholder="비밀번호를 다시 입력하세요">
            </div>

            <div class="edit-actions">
                <a href="/mypage" class="cancel-btn">취소</a>
                <button type="submit" class="save-btn">수정 완료</button>
            </div>

        </form>

    </section>

</main>

</body>
</html>
