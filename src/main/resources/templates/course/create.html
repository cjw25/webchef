<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>요리강의 추가</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" th:href="@{/css/header.css}">
<!--    <link rel="stylesheet" th:href="@{/css/course.css}">-->
    <link rel="stylesheet" th:href="@{/css/course-create.css}">
</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="add-wrap">

    <div class="add-crumb">
        <a th:href="@{/course/list}" style="color:inherit;text-decoration:none;">요리 강의</a>
        &nbsp;›&nbsp; <span>강의 추가</span>
    </div>

    <div class="add-subtitle"><strong>레시피</strong>를 알려주세요</div>

    <div class="add-card">
        <div class="box-header"></div>
        <div class="add-error-box" th:if="${errorMessage}" th:text="${errorMessage}"></div>

        <form th:action="@{/course/create}" th:object="${request}" method="post" enctype="multipart/form-data">

            <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="add-field">
                <label>카테고리<span class="req">*</span></label>
                <select th:field="*{category}" class="category-kind">
                    <option value="">분류</option>
                    <option value="korean">한식</option>
                    <option value="chinese">중식</option>
                    <option value="japanese">일식</option>
                    <option value="western">양식</option>
                    <option value="dessert">간식 / 디저트</option>
                    <option value="etc">기타</option>
                </select>

                <select th:field="*{category}" class="category-level">
                    <option value="">난이도</option>
                    <option value="easy">쉬움</option>
                    <option value="medium">보통</option>
                    <option value="hard">어려움</option>
                </select>

                <select th:field="*{category}" class="category-time">
                    <option value="">조리시간</option>
                    <option value="less">10분미만</option>
                    <option value="ten">10분 이상</option>
                    <option value="twenty">20분 이상</option>
                    <option value="thirty">30분 이상</option>
                    <option value="forty">40분 이상</option>
                    <option value="fifty">50분 이상</option>
                    <option value="hour">1시간 이상</option>
                </select>

                <p class="add-field-error" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></p>
            </div>

            <div class="add-field">
                <label>요리명<span class="req">*</span></label>
                <input type="text" th:field="*{subject}" placeholder="요리 이름을 입력하세요">
                <p class="add-field-error" th:if="${#fields.hasErrors('subject')}" th:errors="*{subject}"></p>
            </div>

            <div class="add-field">
                <label>만드는 법<span class="req">*</span></label>
                <textarea th:field="*{content}" id="add-content" placeholder="레시피를 입력하세요"></textarea>
                <div class="add-char-count"><span id="add-char-current">0</span> / 2000</div>
                <p class="add-field-error" th:if="${#fields.hasErrors('content')}" th:errors="*{content}"></p>
            </div>

            <div class="add-field">
                <label>음식 사진 첨부</label>

                <label class="add-file-drop" for="add-file-input" id="add-file-drop">
                    <div class="add-file-drop-icon">📎</div>
                    <div class="add-file-drop-text">클릭하거나 파일을 선택하세요</div>
                    <div class="add-file-drop-sub">JPG, JPEG, PNG, GIF, WEBP / 최대 10MB</div>
                </label>

                <input type="file"
                       name="img"
                       id="add-file-input"
                       accept="image/jpeg,image/png,image/gif,image/webp"
                       style="display: none;">

                <div class="add-file-list" id="add-file-list"></div>
            </div>

            <div class="add-actions">
                <a th:href="@{/course/list}" class="add-btn add-btn-prev">처음으로</a>
                <button type="submit" class="add-btn add-btn-submit">강의 등록</button>
            </div>

        </form>
    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
