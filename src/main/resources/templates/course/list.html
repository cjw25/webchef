<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Course</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">
    <link rel="stylesheet" th:href="@{/css/course.css}">
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main>
    <div class="page">
        <div class="category">
            <div class="category-kind">
                <a th:href="@{/course/list(keyword=${keyword}, sort=${sort})}"
                   class="all"
                   th:classappend="${category == null or category == ''} ? ' active'">전체 보기</a>
                <a th:href="@{/course/list(category='KOREAN', keyword=${keyword}, sort=${sort})}"
                   class="korean"
                   th:classappend="${category == 'KOREAN'} ? ' active'">• 한식</a>
                <a th:href="@{/course/list(category='CHINESE', keyword=${keyword}, sort=${sort})}"
                   class="chinese"
                   th:classappend="${category == 'CHINESE'} ? ' active'">• 중식</a>
                <a th:href="@{/course/list(category='JAPANESE', keyword=${keyword}, sort=${sort})}"
                   class="japanese"
                   th:classappend="${category == 'JAPANESE'} ? ' active'">• 일식</a>
                <a th:href="@{/course/list(category='WESTERN', keyword=${keyword}, sort=${sort})}"
                   class="western"
                   th:classappend="${category == 'WESTERN'} ? ' active'">• 양식</a>
                <a th:href="@{/course/list(category='DESSERT', keyword=${keyword}, sort=${sort})}"
                   class="dessert"
                   th:classappend="${category == 'DESSERT'} ? ' active'">• 간식 / 디저트</a>
                <a th:href="@{/course/list(category='ETC', keyword=${keyword}, sort=${sort})}"
                   class="etc"
                   th:classappend="${category == 'ETC'} ? ' active'">• 기타</a>
            </div>
        </div>

        <div class="intro">
            <h2 class="title">총 <strong th:text="${paging.totalElements}">0000</strong>개의 강의가 있습니다.</h2>
            <div class="list">
                <a th:href="@{/course/list(category=${category}, keyword=${keyword}, sort='popular')}"
                   class="list1"
                   th:classappend="${sort == null or sort == '' or sort == 'popular'} ? ' active'">인기순</a>
                <a th:href="@{/course/list(category=${category}, keyword=${keyword}, sort='difficulty')}"
                   class="list2"
                   th:classappend="${sort == 'difficulty'} ? ' active'">난이도순</a>
            </div>
        </div>

        <!-- 강의 추가 -->
        <section class="add-box">
            <a class="add-btn"
               th:href="@{/course/create}">
                강의 추가
            </a>
        </section>

        <div class="cook-box">

            <div class="box-container" th:each="course : ${paging.content}">
                <div class="box-img">
                    <a th:href="@{|/course/view/${course.id}|}">
                        <img th:if="${course.hasFile()}" th:src="@{${course.thumbnailUrl}}" alt="음식 이미지" class="food-img">
                    </a>
                </div>
                <div class="skills-box">
                    <h2 class="tag-name" th:text="${course.title}">〈요리명〉</h2>
                    <span class="tag-level" th:text="'✦ ' + ${course.difficultyLabel}">✦ 난이도</span>
                    <span class="tag-time" th:if="${course.cookTime != null}" th:text="${course.cookTime}">조리시간</span>
                </div>
            </div>

        </div>

        <div class="empty-box" th:if="${paging.content.isEmpty()}">
            등록된 강의가 없습니다.
        </div>

        <section class="pagination" th:if="${paging.totalPages > 1}">
            <a th:if="${paging.hasPrevious()}"
               th:href="@{/course/list(page=${paging.number - 1}, keyword=${keyword}, category=${category}, sort=${sort})}">
                &lt;
            </a>

            <a th:each="pageNumber : ${#numbers.sequence(0, paging.totalPages - 1)}"
               th:href="@{/course/list(page=${pageNumber}, keyword=${keyword}, category=${category}, sort=${sort})}"
               th:text="${pageNumber + 1}"
               th:classappend="${pageNumber == paging.number} ? ' active'">
                1
            </a>

            <a th:if="${paging.hasNext()}"
               th:href="@{/course/list(page=${paging.number + 1}, keyword=${keyword}, category=${category}, sort=${sort})}">
                &gt;
            </a>
        </section>



        <div class="bottom"></div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
