<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>강사 신청 관리 | WebChef</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" th:href="@{/css/header.css}">
  <link rel="stylesheet" th:href="@{/css/footer.css}">
  <link rel="stylesheet" th:href="@{/css/chatbot-widget.css}">
  <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="admin-page">

  <section class="admin-hero">
    <div>
      <span class="admin-badge">INSTRUCTOR CHECK</span>
      <h1>강사 신청 관리</h1>
      <p>일반 회원이 신청한 강사 신청을 승인하거나 반려할 수 있습니다.</p>
    </div>

    <a th:href="@{/admin}" class="admin-top-btn">대시보드</a>
  </section>

  <section class="admin-table-card">

    <div class="admin-table-header">
      <div>
        <span>INSTRUCTOR LIST</span>
        <h2>신청 목록</h2>
      </div>

      <div class="admin-action-row">
        <a th:href="@{/admin/instructors/check}" class="admin-sub-btn">전체</a>
        <a th:href="@{/admin/instructors/check(status='PENDING')}" class="admin-sub-btn">대기</a>
        <a th:href="@{/admin/instructors/check(status='APPROVED')}" class="admin-sub-btn">승인</a>
        <a th:href="@{/admin/instructors/check(status='REJECTED')}" class="admin-sub-btn">반려</a>
      </div>
    </div>

    <div class="admin-empty" th:if="${paging == null or paging.totalElements == 0}">
      강사 신청 내역이 없습니다.
    </div>

    <div class="admin-table-wrap" th:if="${paging != null and paging.totalElements > 0}">
      <table class="admin-table">
        <thead>
        <tr>
          <th>ID</th>
          <th>아이디</th>
          <th>이름</th>
          <th>전문 분야</th>
          <th>상태</th>
          <th>신청일</th>
          <th>관리</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="instructor : ${paging.content}">
          <td th:text="${instructor.id}">1</td>
          <td th:text="${instructor.username}">user</td>
          <td th:text="${instructor.name}">name</td>
          <td th:text="${instructor.specialty}">specialty</td>
          <td>
                        <span class="status-badge"
                              th:classappend="${instructor.status.name() == 'APPROVED'} ? ' active' : (${instructor.status.name() == 'REJECTED'} ? ' inactive' : '')"
                              th:text="${instructor.status}">
                            PENDING
                        </span>
          </td>
          <td th:text="${instructor.createdAt != null ? #temporals.format(instructor.createdAt, 'yyyy-MM-dd') : '-'}">
            2026-07-08
          </td>
          <td>
            <a th:href="@{|/admin/instructors/check/${instructor.id}|}" class="table-action-btn">
              상세
            </a>
          </td>
        </tr>
        </tbody>
      </table>
    </div>

    <div class="admin-pagination" th:if="${paging != null and paging.totalPages > 1}">
      <a th:if="${paging.hasPrevious()}"
         th:href="@{/admin/instructors/check(page=${paging.number - 1}, status=${status})}">
        이전
      </a>

      <a th:each="pageNum : ${#numbers.sequence(0, paging.totalPages - 1)}"
         th:href="@{/admin/instructors/check(page=${pageNum}, status=${status})}"
         th:text="${pageNum + 1}"
         th:classappend="${pageNum == paging.number} ? ' active' : ''">
        1
      </a>

      <a th:if="${paging.hasNext()}"
         th:href="@{/admin/instructors/check(page=${paging.number + 1}, status=${status})}">
        다음
      </a>
    </div>

  </section>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
