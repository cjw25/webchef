<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="footer">

  <footer class="site-footer">
    <div class="footer-content">
      <p>© 2026 WebChef. 자취생을 위한 요리 학습 플랫폼.</p>
    </div>
  </footer>

  <!-- 우측 하단 챗봇 / 메타버스 버튼 -->
  <div class="wc-floating-tools" id="floatingTools">

    <button type="button"
            id="chatbotOpenBtn"
            class="wc-chat-floating-btn">
      <span class="wc-chat-btn-icon">AI</span>
      <span class="wc-chat-btn-text">챗봇</span>
    </button>

    <a th:href="@{/metaverse}" class="wc-metaverse-floating-btn">
      <span>🌐</span>
      <strong>메타버스</strong>
    </a>

  </div>

  <!-- 챗봇 패널 -->
  <aside class="wc-chatbot-panel"
         id="chatbotPanel"
         aria-hidden="true">

    <div class="wc-chatbot-header">
      <div class="wc-chatbot-title">
        <div class="wc-chatbot-logo">👨‍🍳</div>

        <div>
          <h2>WebChef 챗봇</h2>
          <p>요리 · 자취 생활 AI 도우미</p>
        </div>
      </div>

      <div class="wc-chatbot-actions">
        <button type="button" id="chatbotResetBtn" title="초기화">↻</button>
        <button type="button" id="chatbotCloseBtn" title="닫기">×</button>
      </div>
    </div>

    <div class="wc-chatbot-messages" id="chatbotMessages">

      <div class="wc-chat-message bot">
        안녕하세요.<br>
        <strong>WebChef AI 챗봇이에요.</strong>
      </div>

      <div class="wc-chatbot-question-title">
        무엇을 도와드릴까요?
      </div>

      <div class="wc-chatbot-suggests">
        <button type="button"
                class="wc-suggest-btn"
                data-question="냉장고 재료로 요리 추천해줘">
          냉장고 재료로 요리 추천
        </button>

        <button type="button"
                class="wc-suggest-btn"
                data-question="자취방 청소 루틴 알려줘">
          자취방 청소 루틴
        </button>

        <button type="button"
                class="wc-suggest-btn"
                data-question="식비 절약 팁 알려줘">
          식비 절약 팁
        </button>
      </div>

    </div>

    <div class="wc-chatbot-input-area">
      <input type="text"
             id="chatbotInput"
             placeholder="무엇이든 물어보세요."
             autocomplete="off">

      <button type="button" id="chatbotSendBtn">
        ↑
      </button>
    </div>

  </aside>

  <script th:src="@{/js/chatbot-widget.js}"></script>

</div>

</body>
</html>
