<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title th:text="${inquiry.subject} + ' | WebChef'">문의하기 상세페이지 | WebChef</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">
<!--    <link rel="stylesheet" th:href="@{/css/inquiry.css}">-->
<!--    <link rel="stylesheet" th:href="@{/css/inquiry-create.css}">-->
    <link rel="stylesheet" th:href="@{/css/inquiry-view.css}">

</head>

<div th:replace="~{fragments/header :: header}"></div>

<body>
<main class="inquiry-wrap">

    <div class="inquiry-crumb">
        <a th:href="@{/inquiry/list}" style="color:inherit;text-decoration:none;">고객센터</a>
        &nbsp;›&nbsp; <span th:text="${inquiry.subject}">문의 제목</span>
    </div>

    <div class="inquiry-banner">1:1 문의</div>
    <div class="inquiry-subtitle">해당 1:1 작성 문의는 작성자만 답변 확인이 가능합니다.</div>

    <div class="inquiry-card view-card">

        <div class="view-header">
            <div class="box-header"></div>
            <div class="view-subject" th:text="${inquiry.subject}">문의 제목</div>
            <div class="view-meta">
                <div>
                    <span class="view-author" th:text="${inquiry.authorName}">작성자</span>
                    <span class="view-dot">|</span>
                    <span class="view-date" th:text="${#temporals.format(inquiry.createDate, 'yyyy.MM.dd HH:mm')}">2026.07.06 12:00</span>
                    <span class="view-dot">|</span>
                    <span class="view-views">👁 <span th:text="${inquiry.viewCount}">0</span></span>
                </div>

                <div class="view-bottom-actions">
                    <div class="view-actions" sec:authorize="isAuthenticated()" th:if="${inquiry.mine}">
                        <a th:href="@{/inquiry/update/{id}(id=${inquiry.id})}" class="inquiry-update-btn inquiry-btn-prev">수정</a>
                        <form th:action="@{/inquiry/delete/{id}(id=${inquiry.id})}" method="post" class="view-delete-form"
                              onsubmit="return confirm('문의를 삭제하시겠습니까?');">
                            <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="inquiry-delete-btn inquiry-btn-danger">삭제</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <hr class="view-divider">

        <!-- 첨부 이미지 -->
        <div class="view-images" th:if="${inquiry.images != null and !inquiry.images.isEmpty()}">
            <img th:each="img : ${inquiry.images}" th:src="@{${img}}" alt="첨부 이미지" class="view-image">
        </div>

        <div class="view-content" th:text="${inquiry.content}">
            문의 내용이 여기에 표시됩니다.
        </div>

    </div>

    <!-- 답변(댓글) 영역 -->
    <div class="inquiry-card answer-card">
        <div class="box-header"></div>
        <div class="answer-title">답변 <span th:text="${inquiry.answers != null ? inquiry.answers.size() : 0}">0</span></div>

        <form th:action="@{/answer/create}" th:object="${answerRequest}" method="post" class="answer-form"
              sec:authorize="isAuthenticated()">
            <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="hidden" th:field="*{inquiryId}"/>
            <textarea th:field="*{content}" placeholder="문의에 대한 답변을 남겨주세요." class="answer-input"></textarea>
            <button type="submit" class="inquiry-btn inquiry-btn-submit">답변 등록</button>
        </form>

        <div class="answer-list">
            <div class="answer-item" th:each="answer : ${inquiry.answers}">
                <div class="answer-item-header">
                    <span class="answer-author" th:text="${answer.authorName}">관리자</span>
                    <span class="answer-date" th:text="${#temporals.format(answer.createDate, 'yyyy.MM.dd HH:mm')}">0000.00.00</span>

                    <div class="view-bottom-actions">
                        <div class="view-actions" sec:authorize="isAuthenticated()" th:if="${inquiry.answers}">
                            <a th:href="@{/inquiry/update/{id}(id=${answer.id})}" class="answer-update-btn answer-btn-prev">수정</a>
                            <form th:action="@{/inquiry/delete/{id}(id=${answer.id})}" method="post" class="answer-delete-form"
                                  onsubmit="return confirm('답변을 삭제하시겠습니까?');">
                                <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit" class="answer-delete-btn answer-btn-danger">삭제</button>
                            </form>
                        </div>
                    </div>
                </div>
                <p class="answer-content" th:text="${answer.content}">답변 내용</p>
            </div>
        </div>

        <p class="answer-empty" th:if="${community.answers == null or community.answers.isEmpty()}">
            답변이 대기 중입니다.
        </p>
    </div>

</main>
</body>

<div th:replace="~{fragments/footer :: footer}"></div>

</html>
