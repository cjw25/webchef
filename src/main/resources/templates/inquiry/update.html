<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <title>문의 수정</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link rel="stylesheet"
          th:href="@{/css/header.css}">

    <link rel="stylesheet"
          th:href="@{/css/footer.css}">

    <link rel="stylesheet"
          th:href="@{/css/inquiry-create.css}">

</head>

<body>

<div class="page">

    <div th:replace="~{fragments/header :: header}"></div>

    <main class="inquiry-wrap">

        <div class="inquiry-crumb">

            <a th:href="@{/inquiry/list}">
                고객센터
            </a>

            &nbsp;›&nbsp;

            <span>문의 수정</span>

        </div>

        <div class="inquiry-banner">
            1:1 문의
        </div>

        <p class="inquiry-subtitle">
            문의 내용을 수정해주세요.
        </p>

        <div class="inquiry-card">

            <div class="box-header"></div>

            <div class="inquiry-error-box"
                 th:if="${errorMessage}"
                 th:text="${errorMessage}">
            </div>

            <form th:action="@{/inquiry/update/{id}(id=${inquiry.id})}"
                  th:object="${request}"
                  method="post"
                  enctype="multipart/form-data">

                <!-- CSRF -->
                <input type="hidden"
                       th:if="${_csrf}"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <!-- 제목 -->
                <div class="inquiry-field">

                    <label for="subject">
                        제목
                        <span class="req">*</span>
                    </label>

                    <input type="text"
                           id="subject"
                           th:field="*{subject}"
                           maxlength="200"
                           placeholder="문의 제목을 입력하세요"
                           required>

                    <div class="inquiry-field-error"
                         th:if="${#fields.hasErrors('subject')}"
                         th:errors="*{subject}">
                    </div>

                </div>

                <!-- 내용 -->
                <div class="inquiry-field">

                    <label for="inquiry-content">
                        내용
                        <span class="req">*</span>
                    </label>

                    <textarea id="inquiry-content"
                              th:field="*{content}"
                              maxlength="2000"
                              placeholder="문의 내용을 입력하세요"
                              required></textarea>

                    <div class="inquiry-char-count">

                        <span id="inquiry-char-current"
                              th:text="${request.content != null
                                  ? #strings.length(request.content)
                                  : 0}">
                            0
                        </span>

                        / 2000

                    </div>

                    <div class="inquiry-field-error"
                         th:if="${#fields.hasErrors('content')}"
                         th:errors="*{content}">
                    </div>

                </div>

                <!-- 현재 등록된 이미지 -->
                <div class="inquiry-field"
                     th:if="${inquiry.imageDetails != null
                         and !inquiry.imageDetails.isEmpty()}">

                    <label>
                        현재 등록된 사진
                    </label>

                    <p class="inquiry-file-drop-sub"
                       style="margin: 6px 0 10px;">
                        삭제할 사진의 ✕ 버튼을 선택해주세요.
                    </p>

                    <div class="existing-image-list">

                        <div th:each="img : ${inquiry.imageDetails}">

                            <!--
                                체크된 이미지 ID가
                                deleteImageIds 목록으로 서버에 전달됨
                            -->
                            <input type="checkbox"
                                   th:field="*{deleteImageIds}"
                                   th:value="${img.id}"
                                   th:id="'delete-image-' + ${img.id}"
                                   class="existing-delete-checkbox">

                            <label th:for="'delete-image-' + ${img.id}"
                                   class="existing-image-label">

                                <img th:src="@{${img.fileUrl}}"
                                     class="inquiry-file-thumb"
                                     alt="기존 첨부 이미지">

                                <span class="existing-image-info">

                                    <span class="inquiry-file-name">
                                        첨부 사진
                                    </span>

                                    <span class="existing-image-delete-guide">
                                        ✕ 버튼을 누르면 삭제됩니다.
                                    </span>

                                    <span class="existing-image-delete-status">
                                        삭제 예정
                                    </span>

                                </span>

                                <span class="existing-image-remove-icon">
                                    ✕
                                </span>

                            </label>

                        </div>

                    </div>

                </div>

                <!-- 새 사진 추가 -->
                <div class="inquiry-field">

                    <label>
                        새 사진 추가
                    </label>

                    <label class="inquiry-file-drop" for="inquiry-file-input" id="inquiry-file-drop">
                        <div class="inquiry-file-drop-icon">📎</div>
                        <div class="inquiry-file-drop-text">클릭하거나 파일을 선택하세요</div>
                        <div class="inquiry-file-drop-sub">
                            JPG, JPEG, PNG, GIF, WEBP / 최대 10MB (기존 사진 포함 최대 3장)
                        </div>
                    </label>

                    <input type="file"
                           name="img"
                           id="inquiry-file-input"
                           accept="image/jpeg,image/png,image/gif,image/webp"
                           multiple
                           style="display: none;">

                    <div class="inquiry-file-list" id="inquiry-file-list"></div>

                </div>

                <!-- 등록된 이미지가 없는 경우 -->
                <div class="inquiry-field"
                     th:if="${inquiry.imageDetails == null
                         or inquiry.imageDetails.isEmpty()}">

                    <label>
                        현재 등록된 사진
                    </label>

                    <p class="inquiry-file-drop-sub">
                        등록된 사진이 없습니다.
                    </p>

                </div>

                <!-- 수정 버튼 -->
                <div class="inquiry-actions">

                    <a th:href="@{/inquiry/view/{id}(id=${inquiry.id})}"
                       class="inquiry-btn inquiry-btn-prev">
                        취소
                    </a>

                    <button type="submit"
                            class="inquiry-btn inquiry-btn-submit">
                        수정 완료
                    </button>

                </div>

            </form>

        </div>

    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

</div>

<script src="/js/inquiry-create.js"></script>

</body>
</html>
