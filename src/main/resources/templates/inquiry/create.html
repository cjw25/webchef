<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>1:1 문의 작성</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">
    <link rel="stylesheet" th:href="@{/css/inquiry-create.css}">
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="inquiry-wrap">

    <div class="inquiry-crumb">
        <a th:href="@{/inquiry/list}" style="color:inherit;text-decoration:none;">고객센터</a>
        &nbsp;›&nbsp; <span>1:1 문의</span>
    </div>

    <div class="inquiry-banner">1:1 문의</div>
    <div class="inquiry-subtitle">궁금한 점을 물어보세요.</div>
    <div class="inquiry-subtitle">해당 1:1 작성 문의는 작성자만 답변 확인이 가능합니다.</div>

    <div class="inquiry-card">
        <div class="box-header"></div>
        <div class="inquiry-error-box" th:if="${errorMessage}" th:text="${errorMessage}"></div>

        <form th:action="@{/inquiry/create}" th:object="${request}" method="post" enctype="multipart/form-data">

            <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="inquiry-field">
                <label>제목<span class="req">*</span></label>
                <input type="text" th:field="*{subject}" placeholder="문의 제목을 입력하세요">
                <p class="inquiry-field-error" th:if="${#fields.hasErrors('subject')}" th:errors="*{subject}"></p>
            </div>

            <div class="inquiry-field">
                <label>내용<span class="req">*</span></label>
                <textarea th:field="*{content}" id="inquiry-content" placeholder="문의 내용을 입력하세요"></textarea>
                <div class="inquiry-char-count"><span id="inquiry-char-current">0</span> / 2000</div>
                <p class="inquiry-field-error" th:if="${#fields.hasErrors('content')}" th:errors="*{content}"></p>
            </div>

            <div class="inquiry-field">
                <label>파일 첨부</label>

                <label class="inquiry-file-drop" for="inquiry-file-input" id="inquiry-file-drop">
                    <div class="inquiry-file-drop-icon">📎</div>
                    <div class="inquiry-file-drop-text">클릭하거나 파일을 선택하세요</div>
                    <div class="inquiry-file-drop-sub">JPG, JPEG, PNG, GIF, WEBP / 최대 10MB</div>
                </label>

                <input type="file"
                       name="img"
                       id="inquiry-file-input"
                       accept="image/jpeg,image/png,image/gif,image/webp"
                       muultiple
                       style="display: none;">

                <div class="inquiry-file-list" id="inquiry-file-list"></div>
            </div>

            <div class="inquiry-actions">
                <a th:href="@{/inquiry/list}" class="inquiry-btn inquiry-btn-prev">처음으로</a>
                <button type="submit" class="inquiry-btn inquiry-btn-submit">문의 등록</button>
            </div>

        </form>

    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
