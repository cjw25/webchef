<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>1:1 문의</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/inquiry-list.css}">
</head>
<body>

<div class="page">

    <div th:replace="~{fragments/header :: header}"></div>

    <main class="inquiry-wrap">

        <div class="inquiry-notice-card">
            <p class="inquiry-notice-title">안내드립니다</p>
            <p class="inquiry-notice-body">
                개인 문의를 받는 공간입니다.<br>
                작성하신 글과 응답은 본인만 확인할 수 있습니다.
            </p>
        </div>

        <div class="inquiry-top-row">
            <span class="inquiry-tab-active">1:1 문의</span>
            <a th:href="@{/inquiry/create}" class="inquiry-write-btn">문의 등록하기</a>
        </div>

        <form class="inquiry-search-box" th:action="@{/inquiry/list}" method="get">
            <input type="text"
                   name="kw"
                   th:value="${kw}"
                   placeholder="검색어를 입력하세요">
            <button type="submit">검색</button>
        </form>

        <p class="inquiry-count">
            총 게시물 <strong th:text="${paging.totalElements}">0</strong>건
        </p>

        <div class="inquiry-card-list">

            <a class="inquiry-item-card"
               th:each="inquiry : ${paging.content}"
               th:href="@{|/inquiry/view/${inquiry.id}|}">

                <div class="inquiry-item-left">
                    <p class="inquiry-item-subject" th:text="${inquiry.subject}">제목</p>
                    <p class="inquiry-item-meta">
                        <span th:text="${#temporals.format(inquiry.createDate, 'yyyy.MM.dd')}">2026.07.10</span>
                        <span class="dot">·</span>
                        <span>조회 <span th:text="${inquiry.viewCount}">0</span></span>
                        <span class="dot" th:if="${!inquiry.imageUrls.isEmpty()}">·</span>
                        <span th:if="${!inquiry.imageUrls.isEmpty()}">📎 사진 첨부</span>
                    </p>
                </div>

                <span class="inquiry-status-badge"
                      th:classappend="${inquiry.answered} ? ' answered' : ' waiting'"
                      th:text="${inquiry.answered} ? '완료' : '대기중'">
                    대기중
                </span>

            </a>

            <div class="inquiry-empty" th:if="${paging.content.isEmpty()}">
                등록된 문의가 없어요.
            </div>

        </div>

        <section class="inquiry-pagination" th:if="${paging.totalPages > 1}">
            <a th:if="${paging.hasPrevious()}"
               th:href="@{/inquiry/list(page=${paging.number - 1}, kw=${kw})}">&lt;</a>

            <a th:each="p : ${#numbers.sequence(0, paging.totalPages - 1)}"
               th:href="@{/inquiry/list(page=${p}, kw=${kw})}"
               th:text="${p + 1}"
               th:classappend="${p == paging.number} ? ' active'">1</a>

            <a th:if="${paging.hasNext()}"
               th:href="@{/inquiry/list(page=${paging.number + 1}, kw=${kw})}">&gt;</a>
        </section>

    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

</div>

</body>
</html>
