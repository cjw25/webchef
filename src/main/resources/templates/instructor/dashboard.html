<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>강사 페이지 | WebChef</title>

  <link rel="stylesheet" th:href="@{/css/header.css}">
  <link rel="stylesheet" th:href="@{/css/footer.css}">
  <link rel="stylesheet" th:href="@{/css/instructor.css}">
  <link rel="stylesheet" th:href="@{/css/chatbot-widget.css}">
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="instructor-page">

  <section class="instructor-hero">
    <span>INSTRUCTOR DASHBOARD</span>
    <h1>강사 페이지</h1>
    <p>
      <strong th:text="${instructor.name}">강사명</strong>
      님의 강사 관리 페이지입니다.
    </p>
  </section>

  <section class="instructor-grid">

    <a th:href="@{/instructor/courses}" class="menu-card">
      <span>01</span>
      <h2>내 강의 관리</h2>
      <p>등록한 강의 목록을 관리합니다.</p>
    </a>

    <a th:href="@{/instructor/courses/create}" class="menu-card">
      <span>02</span>
      <h2>강의 등록</h2>
      <p>새로운 강의를 등록합니다.</p>
    </a>

    <a th:href="@{/community/list}" class="menu-card">
      <span>03</span>
      <h2>커뮤니티 확인</h2>
      <p>수강생과 소통할 수 있습니다.</p>
    </a>

  </section>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
