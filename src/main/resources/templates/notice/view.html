<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">

    <title th:text="${notice.subject} + ' | WebChef'">
        공지사항 상세보기 | WebChef
    </title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link rel="stylesheet"
          th:href="@{/css/header.css}">

    <link rel="stylesheet"
          th:href="@{/css/footer.css}">

    <link rel="stylesheet"
          th:href="@{/css/notice-view.css}">
</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="notice-wrap">

    <div class="notice-hero">

        <div class="notice-crumb">

            <a th:href="@{/notice/list}"
               style="color: inherit; text-decoration: none;">
                고객센터
            </a>

            <span>&nbsp;›&nbsp;</span>

            <span th:text="${notice.subject}">
                공지사항 제목
            </span>

        </div>

        <div class="notice-banner">
            공지사항
        </div>

        <div class="notice-subtitle">
            공지사항 상세 페이지입니다.<br>
            최신 소식과 업데이트, 이벤트 소식을 확인할 수 있습니다.
        </div>

    </div>

    <section class="notice-card view-card">

        <div class="view-header">

            <div class="box-header"></div>

            <h1 class="view-subject"
                th:text="${notice.subject}">
                공지사항 제목
            </h1>

            <div class="view-meta">

                <span class="view-author"
                      th:text="${notice.authorName != null
                               and !#strings.isEmpty(notice.authorName)
                               ? notice.authorName
                               : '관리자'}">
                    관리자
                </span>

                <span class="view-dot">·</span>

                <span class="view-date"
                      th:text="${notice.createDate != null
                               ? #temporals.format(
                                    notice.createDate,
                                    'yyyy.MM.dd HH:mm'
                                 )
                               : ''}">
                    2026.00.00 00:00
                </span>

                <span class="view-dot">·</span>

                <span class="view-views">
                    👁
                    <span th:text="${notice.viewCount}">
                        0
                    </span>
                </span>

                <div class="view-bottom-actions">

                    <div class="view-actions"
                         sec:authorize="hasRole('ADMIN')">

                        <a th:href="@{/notice/update/{id}(id=${notice.id})}"
                           class="notice-update-btn notice-btn-prev">
                            수정
                        </a>

                        <form th:action="@{/notice/delete/{id}(id=${notice.id})}"
                              method="post"
                              class="view-delete-form"
                              onsubmit="return confirm('해당 공지사항을 삭제하시겠어요?');">

                            <input type="hidden"
                                   th:if="${_csrf}"
                                   th:name="${_csrf.parameterName}"
                                   th:value="${_csrf.token}">

                            <button type="submit"
                                    class="notice-delete-btn notice-btn-danger">
                                삭제
                            </button>

                        </form>

                    </div>

                </div>

            </div>

        </div>

        <hr class="view-divider">

        <!-- 첨부 이미지 -->
        <div class="view-images"
             th:if="${notice.imageDetails != null
                     and !notice.imageDetails.isEmpty()}">

            <img th:each="img : ${notice.imageDetails}"
                 th:if="${img.imageUrl != null
                         and !#strings.isEmpty(img.imageUrl)}"
                 th:src="${img.imageUrl}"
                 alt="공지사항 첨부 이미지"
                 class="view-image">

        </div>

        <!-- 이미지가 없을 때는 아무것도 출력하지 않음 -->

        <!-- 공지사항 본문 -->
        <div class="view-content"
             th:text="${notice.content}"
             style="white-space: pre-wrap; word-break: break-word;">
            공지사항 본문이 여기에 표시됩니다.
        </div>

        <a th:href="@{/notice/list}"
           class="notice-btn notice-btn-prev notice-btn-sm">
            공지사항 목록으로
        </a>

    </section>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
