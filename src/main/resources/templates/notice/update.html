<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>공지사항 수정 | WebChef</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link rel="stylesheet"
          th:href="@{/css/header.css}">

    <link rel="stylesheet"
          th:href="@{/css/footer.css}">

    <link rel="stylesheet"
          th:href="@{/css/notice-create.css}">
</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="notice-wrap">

    <div class="notice-crumb">

        <a th:href="@{/notice/list}"
           style="color: inherit; text-decoration: none;">
            고객센터
        </a>

        <span>&nbsp;›&nbsp;</span>

        <span>
            공지사항 수정
        </span>

    </div>

    <div class="notice-subtitle">
        공지사항
    </div>

    <div class="notice-card">

        <div class="box-header"></div>

        <div class="notice-error-box"
             th:if="${errorMessage}"
             th:text="${errorMessage}">
        </div>

        <form th:action="@{/notice/update/{id}(id=${notice.id})}"
              th:object="${request}"
              method="post"
              enctype="multipart/form-data">

            <input type="hidden"
                   th:if="${_csrf}"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <div class="notice-field">

                <label for="notice-subject">
                    제목
                    <span class="req">*</span>
                </label>

                <input type="text"
                       id="notice-subject"
                       th:field="*{subject}"
                       maxlength="200"
                       placeholder="공지사항 제목을 입력하세요">

                <p class="notice-field-error"
                   th:if="${#fields.hasErrors('subject')}"
                   th:errors="*{subject}">
                </p>

            </div>

            <div class="notice-field">

                <label for="notice-content">
                    내용
                    <span class="req">*</span>
                </label>

                <textarea th:field="*{content}"
                          id="notice-content"
                          maxlength="2000"
                          placeholder="공지사항 내용을 입력하세요"></textarea>

                <div class="notice-char-count">
                    <span id="notice-char-current">0</span>
                    / 2000
                </div>

                <p class="notice-field-error"
                   th:if="${#fields.hasErrors('content')}"
                   th:errors="*{content}">
                </p>

            </div>

            <!-- 기존 사진 -->
            <div class="notice-field"
                 th:if="${notice.imageDetails != null
                         and !notice.imageDetails.isEmpty()}">

                <label>
                    현재 등록된 사진
                </label>

                <div class="notice-file-list">

                    <div class="notice-file-item existing-image-item"
                         th:each="img : ${notice.imageDetails}">

                        <img th:src="@{${img.imageUrl}}"
                             class="notice-file-thumb"
                             alt="기존 사진">

                        <div class="notice-file-main">

                            <span th:text="${img.originalFileName != null
                                           ? img.originalFileName
                                           : '등록된 이미지'}">
                                등록된 이미지
                            </span>

                        </div>

                        <input type="checkbox"
                               name="deleteImageIds"
                               th:value="${img.id}"
                               class="existing-delete-checkbox"
                               style="display: none;">

                        <button type="button"
                                class="notice-file-remove existing-remove-btn">
                            ✕
                        </button>

                    </div>

                </div>

            </div>

            <!-- 새로운 사진 첨부 -->
            <div class="notice-field">

                <label>
                    사진 추가
                </label>

                <p class="notice-file-drop-sub"
                   style="margin-bottom: 10px; margin-left: 10px;">
                    기존 사진을 유지하면서 새로운 사진을 추가할 수 있습니다.
                    JPG, JPEG, PNG, GIF, WEBP 파일을 업로드할 수 있으며 파일당 최대 10MB입니다.
                </p>

                <label class="notice-file-drop"
                       for="notice-file-input"
                       id="notice-file-drop">

                    <div class="notice-file-drop-icon">
                        📎
                    </div>

                    <div class="notice-file-drop-text">
                        클릭하거나 파일을 선택하세요
                    </div>

                    <div class="notice-file-drop-sub">
                        JPG, JPEG, PNG, GIF, WEBP / 파일당 최대 10MB
                    </div>

                </label>

                <input type="file"
                       name="images"
                       id="notice-file-input"
                       multiple
                       accept="image/jpeg,image/png,image/gif,image/webp"
                       style="display: none;">

                <div class="notice-file-list"
                     id="notice-file-list">
                </div>

            </div>

            <div class="notice-actions">

                <a th:href="@{/notice/view/{id}(id=${notice.id})}"
                   class="notice-btn notice-btn-prev">
                    취소
                </a>

                <button type="submit"
                        class="notice-btn notice-btn-submit">
                    공지사항 수정 완료
                </button>

            </div>

        </form>

    </div>

</main>

<script th:src="@{/js/notice-update.js}"></script>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
