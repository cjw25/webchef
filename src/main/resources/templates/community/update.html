<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>글 수정 | WebChef</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/community.css}">
    <link rel="stylesheet" th:href="@{/css/community-create.css}">
    <link rel="stylesheet" th:href="@{/css/community-view.css}">
</head>

<body>

<!-- 공통 헤더 -->
<div th:replace="~{fragments/header :: header}"></div>

<main class="write-wrap">

    <div class="write-crumb">
        <a th:href="@{/community/list}" style="color:inherit;text-decoration:none;">우리들의 대화</a>
        &nbsp;›&nbsp; <span>글 수정</span>
    </div>

    <div class="write-tag">✍️ COMMUNITY</div>
    <h1>글을 <span class="highlight">수정해주세요</span></h1>
    <p class="write-subtitle">내용을 고치고 저장하면 바로 반영돼요.</p>

    <div class="write-card">

        <div class="write-error-box" th:if="${errorMessage}" th:text="${errorMessage}"></div>

        <form th:action="@{/community/update/{id}(id=${community.id})}" th:object="${request}" method="post" enctype="multipart/form-data">

            <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="write-field">
                <label>카테고리<span class="req">*</span></label>
                <select th:field="*{category}">
                    <option value="">카테고리 선택</option>
                    <option value="레시피 꿀팁">레시피 꿀팁</option>
                    <option value="장보기 팁">장보기 팁</option>
                    <option value="간편조리도구팁">간편조리도구팁</option>
                </select>
            </div>

            <div class="write-field">
                <label>제목<span class="req">*</span></label>
                <input type="text" th:field="*{subject}" placeholder="제목을 입력하세요">
            </div>

            <div class="write-field">
                <label>내용<span class="req">*</span></label>
                <textarea th:field="*{content}" id="write-content" placeholder="내용을 입력하세요"></textarea>
                <div class="write-char-count"><span id="write-char-current">0</span> / 2000</div>
            </div>

            <!-- 기존 사진 -->
            <div class="write-field" th:if="${community.imageDetails != null and !community.imageDetails.isEmpty()}">
                <label>현재 등록된 사진</label>
                <div class="write-file-list">
                    <div class="write-file-item existing-image-item" th:each="img : ${community.imageDetails}">
                        <img th:src="@{${img.fileUrl}}" class="write-file-thumb" alt="기존 사진">
                        <label class="write-file-main">
                            <input type="radio" th:field="*{mainSelect}" th:value="'existing-' + ${img.id}">
                            대표사진
                        </label>
                        <input type="checkbox" th:field="*{deleteImageIds}" th:value="${img.id}" class="existing-delete-checkbox" style="display:none;">
                        <button type="button" class="write-file-remove existing-remove-btn">✕</button>
                    </div>
                </div>

            </div>

            <!-- 새 사진 첨부 -->
            <div class="write-field">
                <label>사진 추가</label>
                <p class="write-file-drop-sub" style="margin-bottom:10px;">
                    기존 사진은 그대로 두고, 새 사진을 추가로 첨부할 수 있어요. (전체 최대 5장)
                </p>

                <label class="write-file-drop" for="write-file-input" id="write-file-drop">
                    <div class="write-file-drop-icon">📎</div>
                    <div class="write-file-drop-text">클릭하거나 파일을 선택하세요</div>
                    <div class="write-file-drop-sub">JPG, JPEG, PNG, GIF, WEBP / 최대 10MB</div>
                </label>

                <input type="file"
                       name="img"
                       id="write-file-input"
                       multiple
                       accept="image/jpeg,image/png,image/gif,image/webp"
                       style="display: none;">

                <div class="write-file-list" id="write-file-list"></div>
            </div>

            <div class="write-actions">
                <a th:href="@{/community/view/{id}(id=${community.id})}" class="write-btn write-btn-prev">취소</a>
                <button type="submit" class="write-btn write-btn-submit">수정 완료</button>
            </div>

        </form>

    </div>

</main>

<script src="/js/community-update.js"></script>
</body>
</html>
