<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Create tip | WebChef</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/tips.css}">
</head>

<body>

<!-- 공통 헤더 -->
<div th:replace="~{fragments/header :: header}"></div>

<main class="tips-wrap">

    <section class="tips-hero">
        <h1>자취요리팁 추가</h1>
        <p>새로운 팁을 등록해주세요.</p>
    </section>

    <form class="tips-form"
          th:action="@{/tips/create}"
          method="post">

        <div class="form-row">
            <label for="category">카테고리</label>
            <select id="category" name="category" required>
                <option th:each="c : ${categories}"
                        th:value="${c}"
                        th:text="${c.name() == 'INGREDIENT_PREP' ? '재료 손질법' : (c.name() == 'INGREDIENT_STORE' ? '재료 보관법' : '조리 도구 관리법')}">
                </option>
            </select>
        </div>

        <div class="form-row">
            <label for="title">제목</label>
            <input type="text" id="title" name="title" maxlength="150" required>
        </div>

        <div class="form-row">
            <label for="imageUrl">사진 URL</label>
            <input type="text" id="imageUrl" name="imageUrl" placeholder="https://...">
        </div>

        <div class="form-row">
            <label for="content">내용</label>
            <textarea id="content" name="content" rows="10" required></textarea>
        </div>

        <div class="form-actions">
            <button type="submit" class="tips-write-btn">Create</button>
        </div>

    </form>

</main>

</body>
</html>
