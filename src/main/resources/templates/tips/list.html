<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>자취요리팁 | WebChef</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/tips.css}">
</head>

<body>

<!-- 공통 헤더 -->
<div th:replace="~{fragments/header :: header}"></div>

<main class="tips-wrap">

    <!-- 상단 소개 영역 -->
    <section class="tips-hero">

        <h1>자취요리팁</h1>

        <p>
            재료 손질부터 보관, 도구 관리까지<br>
            자취 요리에 필요한 팁을 모아봤어요.
        </p>

    </section>

    <!-- 카테고리 탭 -->
    <nav class="tips-tabs">

        <a th:href="@{/tips/list(keyword=${keyword})}"
           th:classappend="${category == null or #strings.isEmpty(category)} ? ' active'">
            전체 보기
        </a>

        <a th:href="@{/tips/list(category='INGREDIENT_PREP', keyword=${keyword})}"
           th:classappend="${category == 'INGREDIENT_PREP'} ? ' active'">
            재료 손질법
        </a>

        <a th:href="@{/tips/list(category='INGREDIENT_STORE', keyword=${keyword})}"
           th:classappend="${category == 'INGREDIENT_STORE'} ? ' active'">
            재료 보관법
        </a>

        <a th:href="@{/tips/list(category='TOOL_MANAGE', keyword=${keyword})}"
           th:classappend="${category == 'TOOL_MANAGE'} ? ' active'">
            조리 도구 관리법
        </a>

    </nav>

    <!-- 관리자 전용 추가 버튼 -->
    <section class="tips-write-box" sec:authorize="hasRole('ADMIN')">

        <a class="tips-write-btn"
           th:href="@{/tips/create}">
            + 등록하기
        </a>

    </section>

    <!-- 팁 카드 목록 -->
    <section class="tips-grid" th:if="${!paging.empty}">

        <a class="tip-card"
           th:each="tip : ${paging.content}"
           th:href="@{|/tips/view/${tip.id}|}">

            <div class="tip-thumb">
                <img th:if="${tip.imageUrl != null and !#strings.isEmpty(tip.imageUrl)}"
                     th:src="${tip.imageUrl}"
                     th:alt="${tip.title}">
                <span class="tip-thumb-placeholder"
                      th:unless="${tip.imageUrl != null and !#strings.isEmpty(tip.imageUrl)}">
                    사진 준비 중
                </span>
            </div>

            <div class="tip-body">
                <span class="tip-badge" th:text="${tip.categoryName}">카테고리</span>
                <p class="tip-subtitle" th:text="${tip.contentPreview}">부제목</p>
                <p class="tip-title" th:text="${tip.title}">제목</p>
            </div>

        </a>

    </section>

    <p class="tips-empty" th:if="${paging.empty}">등록된 팁이 없습니다.</p>

    <!-- 페이징 -->
    <section class="tips-pagination" th:if="${!paging.empty and paging.totalPages > 1}">

        <a th:if="${paging.hasPrevious()}"
           th:href="@{/tips/list(page=${paging.number - 1}, keyword=${keyword}, category=${category})}">
            &lt;
        </a>

        <a th:each="pageNum : ${#numbers.sequence(0, paging.totalPages - 1)}"
           th:href="@{/tips/list(page=${pageNum}, keyword=${keyword}, category=${category})}"
           th:text="${pageNum + 1}"
           th:classappend="${pageNum == paging.number} ? ' active'">
        </a>

        <a th:if="${paging.hasNext()}"
           th:href="@{/tips/list(page=${paging.number + 1}, keyword=${keyword}, category=${category})}">
            &gt;
        </a>

    </section>

</main>

</body>
</html>
