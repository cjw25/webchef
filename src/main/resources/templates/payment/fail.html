<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>결제 실패 | WebChef</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" th:href="@{/css/header.css}">
  <link rel="stylesheet" th:href="@{/css/footer.css}">
  <link rel="stylesheet" th:href="@{/css/chatbot-widget.css}">
  <link rel="stylesheet" th:href="@{/css/payment-result.css}">
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="payment-result-page">
  <section class="payment-result-card fail">

    <div class="payment-result-icon">!</div>

    <h1>결제 실패</h1>

    <p th:text="${message != null ? message : '결제 처리 중 문제가 발생했습니다.'}">
      결제 처리 중 문제가 발생했습니다.
    </p>

    <p class="payment-error-code" th:if="${code != null}">
      오류 코드:
      <span th:text="${code}">ERROR</span>
    </p>

    <div class="payment-result-actions">
      <a th:href="@{/course/list}" class="primary-btn">
        강의 목록으로 이동
      </a>

      <a href="javascript:history.back()" class="secondary-btn">
        이전 페이지로
      </a>
    </div>

  </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
